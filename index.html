/* ===== voice reader (v16, consolidated) ===== */
#tts{--tr:#d2132a;--tr1:#ff5252;--tr2:#a80019;position:fixed;inset-inline:0;margin-inline:auto;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 64px);width:min(94vw,560px);max-height:min(86dvh,720px);z-index:60;display:none;flex-direction:column;overflow:hidden;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:22px;box-shadow:0 28px 80px rgba(8,14,26,.45),0 2px 6px rgba(8,14,26,.14);overscroll-behavior:contain;contain:layout style;line-height:1.5}

<script id="extFitJs">
(()=>{

 let busy=false,last=0;

  if(busy)return;
  const b=document.body; if(!b.classList.contains('ext'))return;
  const mp=document.querySelector('.mp'); if(!mp||!mp.offsetParent)return;
  const vis=c=>{const s=getComputedStyle(c);return s.display!=='none'&&(s.position==='static'||s.position==='relative')};
  const el=[...mp.children].find(c=>c.matches('.deck,.rad,.alt')&&vis(c));
  if(!el)return;
  busy=true;
  try{
   const cs=getComputedStyle(mp),pl=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),pt=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
   const gap=parseFloat(cs.rowGap)||0,cgap=parseFloat(cs.columnGap)||0,land=matchMedia(LAND).matches;
   mp.style.setProperty('--zl','1');mp.classList.add('zl');
   const h1=el.getBoundingClientRect().height,w1=el.getBoundingClientRect().width;
   if(!(h1>0)){busy=false;return}
   const innerW=mp.clientWidth-pl,innerH=mp.clientHeight-pt;
   let colW,availH;
   if(land){colW=(innerW-cgap)/2.1;availH=innerH}
   else{
    colW=innerW;let o=0,n=0;
    for(const c of mp.children){if(c===el||!vis(c))continue;o+=c.getBoundingClientRect().height;n++}
    availH=innerH-o-gap*n;
   }
   const zw=Math.max(1,colW/520);
   let z=Math.min(zw,availH/h1);
   z=Math.max(.4,Math.min(2.4,z));
   mp.style.setProperty('--zl',z.toFixed(3));
   last=z;
  }finally{busy=false}
 }

 new MutationObserver(sched).observe(document.body,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
