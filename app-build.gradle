plugins { id 'com.android.application' }

android {
    namespace 'app.filereader'
    compileSdk 34

    defaultConfig {
        applicationId 'app.filereader'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        main {
            storeFile file('release.keystore')
            storePassword 'filereader123'
            keyAlias 'filereader'
            keyPassword 'filereader123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.main
        }
        debug {
            signingConfig signingConfigs.main
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
