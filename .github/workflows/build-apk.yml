name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble project from flat files
        run: |
          mkdir -p android/app/src/main/java/app/filereader android/app/src/main/assets android/app/src/main/res/mipmap-xxxhdpi
          cp build.gradle settings.gradle gradle.properties android/
          cp app-build.gradle android/app/build.gradle
          cp release.keystore android/app/
          cp AndroidManifest.xml android/app/src/main/
          cp MainActivity.java android/app/src/main/java/app/filereader/
          cp index.html android/app/src/main/assets/
          cp ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download offline libraries (PDF, Word, Excel, OCR, fonts)
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/android/app/src/main/assets"
          mkdir -p "$A/lib/pdfjs" "$A/lib/tesseract/core" "$A/lib/tessdata" "$A/lib/fonts/files"
          mkdir -p /tmp/npm && cd /tmp/npm && npm init -y > /dev/null
          npm install --no-audit --no-fund \
            pdfjs-dist@3.11.174 tesseract.js@5.1.1 mammoth@1.6.0 xlsx@0.18.5 \
            @tesseract.js-data/ara @tesseract.js-data/eng @tesseract.js-data/fra \
            @fontsource/ibm-plex-sans-arabic
          N=/tmp/npm/node_modules

          cp "$N/pdfjs-dist/build/pdf.min.js" "$N/pdfjs-dist/build/pdf.worker.min.js" "$A/lib/"
          cp -r "$N/pdfjs-dist/cmaps" "$N/pdfjs-dist/standard_fonts" "$A/lib/pdfjs/"
          cp "$N/mammoth/mammoth.browser.min.js" "$A/lib/"
          cp "$N/xlsx/dist/xlsx.full.min.js" "$A/lib/"
          cp "$N/tesseract.js/dist/tesseract.min.js" "$A/lib/"
          cp "$N/tesseract.js/dist/worker.min.js" "$A/lib/tesseract/"
          cp "$N"/tesseract.js-core/tesseract-core* "$A/lib/tesseract/core/"

          for L in ara eng fra; do
            F=$(find "$N/@tesseract.js-data/$L" -name "$L.traineddata.gz" -path "*best_int*" | head -1)
            [ -n "$F" ] || F=$(find "$N/@tesseract.js-data/$L" -name "$L.traineddata.gz" | head -1)
            cp "$F" "$A/lib/tessdata/$L.traineddata.gz"
          done

          FS="$N/@fontsource/ibm-plex-sans-arabic"
          : > "$A/lib/fonts/fonts.css"
          for W in 400 500 600 700; do cat "$FS/$W.css" >> "$A/lib/fonts/fonts.css"; done
          cp "$FS"/files/*-400-normal.woff2 "$FS"/files/*-500-normal.woff2 "$FS"/files/*-600-normal.woff2 "$FS"/files/*-700-normal.woff2 "$A/lib/fonts/files/"

          echo "---- verifying offline files ----"
          cd "$A"
          for f in lib/pdf.min.js lib/pdf.worker.min.js lib/mammoth.browser.min.js lib/xlsx.full.min.js \
                   lib/tesseract.min.js lib/tesseract/worker.min.js lib/fonts/fonts.css \
                   lib/tessdata/ara.traineddata.gz lib/tessdata/eng.traineddata.gz lib/tessdata/fra.traineddata.gz; do
            [ -s "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          [ "$(ls lib/pdfjs/cmaps | wc -l)" -gt 10 ] || { echo "MISSING: pdf cmaps"; exit 1; }
          [ "$(ls lib/pdfjs/standard_fonts | wc -l)" -gt 5 ] || { echo "MISSING: pdf standard fonts"; exit 1; }
          [ "$(ls lib/tesseract/core | wc -l)" -gt 1 ] || { echo "MISSING: tesseract core"; exit 1; }
          [ "$(ls lib/fonts/files | wc -l)" -gt 3 ] || { echo "MISSING: font files"; exit 1; }
          du -sh lib; find lib -type f | wc -l

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk FileReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FileReader-APK
          path: FileReader.apk
          if-no-files-found: error
